name: Release Desktop Tauri App (v1.0.0)

on:
  release:
    types: [published]
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-release-desktop:
    name: 💻 Build & Release Desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            os_name: 'macOS'
          - platform: 'ubuntu-22.04'
            os_name: 'Linux'
          - platform: 'windows-latest'
            os_name: 'Windows'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install JavaScript Dependencies
        run: npm install --no-audit

      - name: Build Web Dist
        run: node scripts/build-web-dist.js

      - name: Build Tauri Desktop Native Binaries
        run: |
          npx tauri build

      - name: Upload Binaries directly to GitHub Release (desktop-v1.0.0)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v1.0.0
          name: "💻 LienLibre Desktop v1.0.0 (macOS, Windows, Linux)"
          body: |
            # 💻 LienLibre Desktop App — Version 1.0.0

            Application de bureau native ultra-légère propulsée par **Tauri & Rust**.

            ---

            ### 📥 Fichiers Téléchargeables :
            - 🍎 **macOS (Apple Silicon & Intel)** : `.dmg` et `.app`
            - 🪟 **Windows (10 / 11)** : Installateur `.exe` (NSIS) et `.msi`
            - 🐧 **Linux (Ubuntu, Debian, Fedora, Arch)** : `.AppImage` et `.deb`

            ---
            *Conforme à l'exception d'utilisation équitable (Art. 29 LDA / C-18).*
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
