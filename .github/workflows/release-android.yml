name: Release Android App (v1.0.0)

on:
  push:
    branches: [main]
    tags: ['android-v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-release-android:
    name: 📱 Build & Release Android App (v1.0.0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: |
          cd android
          chmod +x gradlew || true

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/*.apk ../dist/lienlibre-android-v1.0.0.apk || true
          cd ..

      - name: Create Dedicated Android Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.0
          name: "📱 LienLibre Android v1.0.0"
          body: |
            # 📱 LienLibre Android App — Version 1.0.0

            Application Android native moderne respectant les directives **Google Android with AI** et **Core App Quality**.

            ---

            ### 📥 Fichier Téléchargeable :
            - 🤖 **[Télécharger l'Application Android (APK v1.0.0)](https://github.com/Bwillou1/LienLibre/releases/download/android-v1.0.0/lienlibre-android-v1.0.0.apk)**

            ---

            ### ✨ Fonctionnalités Clés :
            - **Feuille de Partage Système (`ACTION_SEND`)** : Interception en 1-clic depuis Chrome, Reddit, Twitter/X, Google News.
            - **Moteur On-Device Edge AI** : Analyse locale des métadonnées (paywalls, clickbait, score de fiabilité) sans envoyer de données à des serveurs tiers.
            - **Material 3 Dynamic Theming** : Interface adaptative Edge-to-Edge pour téléphones, tablettes et pliables.
            - **Réseau Hors-Ligne & TXQR** : Émetteur QR animés pour transfert sans Internet et paquets Meshtastic (LoRa 915 MHz).
            - **Passerelle Liseuse E-Ink** : Synchronisation 4 chiffres (PIN).

            ---
            *Conforme à l'exception d'utilisation équitable (Art. 29 LDA / C-18).*
          files: dist/lienlibre-android-v1.0.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Android Package to GitHub Packages Maven
        continue-on-error: true
        run: |
          cd android
          ./gradlew publish --no-daemon || echo "Maven publication completed or skipped if credentials not active"
          cd ..
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Log in to GitHub Container Registry (GHCR)
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Android App Container Package
        continue-on-error: true
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/android/Dockerfile
          push: true
          tags: |
            ghcr.io/bwillou1/lienlibre-android:latest
            ghcr.io/bwillou1/lienlibre-android:v1.0.0
