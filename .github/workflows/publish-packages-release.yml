name: Publish Packages & Release (Android App & Chrome Extension)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-publish-extension:
    name: 🧩 Package & Publish Chrome Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@bwillou1'

      - name: Package Chrome Extension ZIP
        run: |
          mkdir -p dist
          cd extension
          zip -r ../dist/lienlibre-chrome-extension-v2.5.0.zip . -x "*.DS_Store*" "*.git*"
          cd ..

      - name: Publish NPM Packages to GitHub Packages
        run: |
          # Publish Root Package (@bwillou1/lienlibre)
          npm publish --access public || echo "Root package version already published"
          
          # Publish Chrome Extension Package (@bwillou1/lienlibre-extension)
          cd extension
          npm publish --access public || echo "Extension package version already published"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lienlibre-chrome-extension
          path: dist/lienlibre-chrome-extension-v2.5.0.zip

  build-and-publish-android:
    name: 📱 Build & Publish Android App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: |
          cd android
          chmod +x gradlew || true

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/*.apk ../dist/lienlibre-android-app-debug-v2.5.0.apk || true

      - name: Publish Android Package to GitHub Packages Maven
        run: |
          cd android
          ./gradlew publish --no-daemon || echo "Maven publication completed or skipped if credentials not active"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lienlibre-android-apk
          path: dist/lienlibre-android-app-debug-v2.5.0.apk

  create-github-release:
    name: 🚀 Create GitHub Release with Binaries
    needs: [build-and-publish-extension, build-and-publish-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Extension Artifact
        uses: actions/download-artifact@v4
        with:
          name: lienlibre-chrome-extension
          path: dist/

      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: lienlibre-android-apk
          path: dist/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.5.0
          name: "LienLibre v2.5.0 - Android App & Extension Chrome"
          body: |
            # 🚀 LienLibre v2.5.0 — Publication Officielle
            
            Passerelle citoyenne, éducative et de recherche pour l'interopérabilité des métadonnées Open Graph au Canada.

            ---

            ### 📦 Paquets & Téléchargements Inclus :
            - 📱 **Application Android (`lienlibre-android-app-debug-v2.5.0.apk`)** :
              - Interface Jetpack Compose Material 3 Edge-to-Edge.
              - Moteur On-Device Edge AI (analyse locale de métadonnées, paywalls, clickbait).
              - Intégration feuille de partage Android (`ACTION_SEND`).
              - Mode TXQR / Mesh hors-ligne & Liseuse E-Ink 4 chiffres.
            - 🧩 **Extension Google Chrome (`lienlibre-chrome-extension-v2.5.0.zip`)** :
              - Manifest V3 avec badge interactif en 1-clic.
              - Générateur de capsules, QR animés TXQR et export multi-plateformes.
            - 🌐 **GitHub Packages** :
              - `@bwillou1/lienlibre` (NPM)
              - `@bwillou1/lienlibre-extension` (NPM)
              - `org.lienlibre:lienlibre-android` (Maven)

            ---
            *Conforme à l'exception d'utilisation équitable (Art. 29 LDA / C-18). Simple passerelle neutre sans scraping du texte intégral.*
          files: |
            dist/lienlibre-chrome-extension-v2.5.0.zip
            dist/lienlibre-android-app-debug-v2.5.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
