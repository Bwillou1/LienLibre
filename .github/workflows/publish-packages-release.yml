name: Publish Packages & Release (Android App & Chrome Extension)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-publish-extension:
    name: 🧩 Package & Publish Chrome Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@bwillou1'

      - name: Package Chrome Extension ZIP
        run: |
          mkdir -p dist
          cd extension
          zip -r ../dist/lienlibre-chrome-extension-v2.5.0.zip . -x "*.DS_Store*" "*.git*"
          cp ../dist/lienlibre-chrome-extension-v2.5.0.zip ./lienlibre-extension.zip
          cd ..

      - name: Publish NPM Packages to GitHub Packages
        run: |
          # Increment / Publish Root Package (@bwillou1/lienlibre)
          npm publish --access public || echo "Root package version already published"
          
          # Increment / Publish Chrome Extension Package (@bwillou1/lienlibre-extension)
          cd extension
          npm publish --access public || echo "Extension package version already published"
          cd ..
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Chrome Extension Container Package
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/extension/Dockerfile
          push: true
          tags: |
            ghcr.io/bwillou1/lienlibre-extension:latest
            ghcr.io/bwillou1/lienlibre-extension:v2.5.0

      - name: Upload Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lienlibre-chrome-extension
          path: dist/lienlibre-chrome-extension-v2.5.0.zip

  build-and-publish-android:
    name: 📱 Build & Publish Android App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: |
          cd android
          chmod +x gradlew || true

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/*.apk ../dist/lienlibre-android-app-debug-v2.5.0.apk || true
          cd ..

      - name: Publish Android Package to GitHub Packages Maven
        run: |
          cd android
          ./gradlew publish --no-daemon || echo "Maven publication completed or skipped if credentials not active"
          cd ..
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Android App Container Package
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/android/Dockerfile
          push: true
          tags: |
            ghcr.io/bwillou1/lienlibre-android:latest
            ghcr.io/bwillou1/lienlibre-android:v2.5.0

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lienlibre-android-apk
          path: dist/lienlibre-android-app-debug-v2.5.0.apk

  create-github-release:
    name: 🚀 Create GitHub Release with Direct Binaries
    needs: [build-and-publish-extension, build-and-publish-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Extension Artifact
        uses: actions/download-artifact@v4
        with:
          name: lienlibre-chrome-extension
          path: dist/

      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: lienlibre-android-apk
          path: dist/

      - name: Create or Update GitHub Release with Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.5.0
          name: "LienLibre v2.5.0 - Téléchargements Directs (APK & Extension Chrome)"
          body: |
            # 🚀 Téléchargements Officiels LienLibre v2.5.0
            
            Passerelle citoyenne, éducative et de recherche pour l'interopérabilité des métadonnées Open Graph au Canada.

            ---

            ### 📥 Téléchargements Directs des Fichiers :
            - 📱 **[Télécharger l'Application Android (APK)](https://github.com/Bwillou1/LienLibre/releases/download/v2.5.0/lienlibre-android-app-debug-v2.5.0.apk)** :
              - Interface Jetpack Compose Material 3 Edge-to-Edge.
              - Moteur On-Device Edge AI (analyse locale des métadonnées, alertes paywalls, indice de fiabilité).
              - Intégration de la feuille de partage Android (`ACTION_SEND`).
              - Mode TXQR / Mesh hors-ligne & Liseuse E-Ink 4 chiffres.
            - 🧩 **[Télécharger l'Extension Google Chrome (ZIP)](https://github.com/Bwillou1/LienLibre/releases/download/v2.5.0/lienlibre-chrome-extension-v2.5.0.zip)** :
              - Manifest V3 avec badge interactif en 1-clic.
              - Générateur de capsules, QR animés TXQR et export multi-plateformes.

            ---

            ### 📦 Paquets GitHub Packages Disponibles :
            - `ghcr.io/bwillou1/lienlibre-android` (Container Package)
            - `ghcr.io/bwillou1/lienlibre-extension` (Container Package)
            - `@bwillou1/lienlibre` (NPM Registry)
            - `@bwillou1/lienlibre-extension` (NPM Registry)
            - `org.lienlibre:lienlibre-android` (Maven Registry)

            ---
            *Conforme à l'exception d'utilisation équitable (Art. 29 LDA / C-18). Simple passerelle neutre sans scraping du texte intégral.*
          files: |
            dist/lienlibre-chrome-extension-v2.5.0.zip
            dist/lienlibre-android-app-debug-v2.5.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
