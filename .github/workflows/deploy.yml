name: Automatic Deploy to Cloudflare & GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'whitelist.js'
      - 'worker.js'
      - 'wrangler.toml'
      - 'index.html'
      - 'sw.js'
  workflow_dispatch:

jobs:
  deploy-worker:
    name: 🚀 Deploy Cloudflare Worker & Whitelist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        continue-on-error: true
