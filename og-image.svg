<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Subtle Background Grids / Ambient Orbs -->
  <circle cx="200" cy="150" r="300" fill="#06b6d4" opacity="0.08" filter="url(#glow)"/>
  <circle cx="1000" cy="480" r="350" fill="#6366f1" opacity="0.08" filter="url(#glow)"/>

  <!-- Outer Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="32" stroke="rgba(255,255,255,0.08)" stroke-width="2" fill="none"/>

  <!-- Logo Mark -->
  <g transform="translate(100, 150)">
    <rect width="130" height="130" rx="32" fill="#0f172a" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
    <g stroke="url(#primary)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" transform="translate(20, 20) scale(0.7)">
      <path d="M70 46l8-8a24 24 0 0 1 34 34l-24 24a24 24 0 0 1-34-34l8-8" />
      <path d="M58 82l-8 8a24 24 0 0 1-34-34l24-24a24 24 0 0 1 34 34l-8 8" />
    </g>
  </g>

  <!-- Brand Typography -->
  <text x="260" y="215" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="72" fill="#ffffff" letter-spacing="-1.5">
    Lien<tspan fill="url(#textGrad)">Libre</tspan>
  </text>
  <text x="265" y="260" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="22" fill="#38bdf8" letter-spacing="2">
    PASSERELLE CITOYENNE D'INFORMATION
  </text>

  <!-- Tagline / Headline -->
  <text x="100" y="370" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="44" fill="#f1f5f9" letter-spacing="-0.5">
    Partagez l'actualité en toute liberté et transparence.
  </text>

  <!-- Description Body -->
  <text x="100" y="425" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="24" fill="#94a3b8">
    Outil civique et éducatif pour l'interopérabilité des métadonnées Open Graph
  </text>
  <text x="100" y="460" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="24" fill="#94a3b8">
    et la préservation du libre accès aux nouvelles canadiennes d'intérêt public.
  </text>

  <!-- Bottom Badges / Trust Markers -->
  <g transform="translate(100, 520)">
    <!-- Badge 1: Open Source -->
    <rect width="180" height="42" rx="21" fill="rgba(14,165,233,0.12)" stroke="rgba(14,165,233,0.3)" stroke-width="1.5"/>
    <text x="90" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="16" fill="#38bdf8">
      🍁 100% Open Source
    </text>

    <!-- Badge 2: Fair Dealing -->
    <rect x="200" width="220" height="42" rx="21" fill="rgba(99,102,241,0.12)" stroke="rgba(99,102,241,0.3)" stroke-width="1.5"/>
    <text x="310" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="16" fill="#818cf8">
      ⚖️ Utilisation Équitable
    </text>

    <!-- Badge 3: Privacy First -->
    <rect x="440" width="180" height="42" rx="21" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.3)" stroke-width="1.5"/>
    <text x="530" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="16" fill="#34d399">
      🔒 Zéro Log / Privé
    </text>

    <!-- Domain Link on Right -->
    <text x="1000" y="27" text-anchor="end" font-family="monospace" font-weight="600" font-size="20" fill="#64748b">
      bwillou1.github.io/LienLibre
    </text>
  </g>
</svg>
