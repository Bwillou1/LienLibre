[package]
name = "lienlibre-desktop"
version = "1.0.0"
description = "Passerelle citoyenne et éducative d'interopérabilité des métadonnées Open Graph (Tauri Desktop)"
authors = ["William Guindon <guindonwilliam2@gmail.com>"]
edition = "2021"
license = "MIT"

[lib]
name = "lienlibre_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-shell = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
