name = "lienlibre-api"
main = "worker.js"
compatibility_date = "2024-05-25"

# ======================================================================
# OPTIONNEL : STATISTIQUES EN TEMPS RÉEL (Cloudflare KV)
# ======================================================================
# Pour activer le tableau de bord de statistiques en direct :
# 1. Créez un KV Namespace nommé "lienlibre-kv" dans le tableau de bord Cloudflare (Workers & Pages > KV).
# 2. Liez-le à ce Worker avec la variable d'environnement (binding) "LIENLIBRE_KV".
# 
# Vous pouvez aussi décommenter les lignes ci-dessous et remplacer l'id par le vôtre :
# [[kv_namespaces]]
# binding = "LIENLIBRE_KV"
# id = "VOTRE_ID_DE_KV_ICI"
